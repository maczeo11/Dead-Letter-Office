services:
  - type: web
    name: dead-letter-office-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run server:prod
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
